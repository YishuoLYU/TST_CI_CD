# PR Validation Workflow - Code check and unit testing
# Automatically runs when creating or updating Pull Requests

name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for incremental checks
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Code format check (Prettier)
        run: npm run prettier:verify
      
      - name: ESLint check
        run: npm run lint
      
      - name: LWC unit tests
        run: npm run test:unit:coverage
      
      - name: Upload test coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Salesforce syntax validation (optional)
  salesforce-validation:
    name: Salesforce Syntax Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version
      
      - name: Authorize to Sandbox environment (validation only)
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_SANDBOX }}" > ./SFDX_AUTH_URL.txt
          sf org login sfdx-url --sfdx-url-file ./SFDX_AUTH_URL.txt --alias validation-org --set-default
          rm ./SFDX_AUTH_URL.txt
        if: ${{ secrets.SFDX_AUTH_URL_SANDBOX != '' }}
      
      - name: Check force-app directory
        run: |
          if [ ! -d "force-app" ] || [ -z "$(find force-app -type f 2>/dev/null)" ]; then
            echo "⚠️  force-app directory is empty, skipping Salesforce validation"
            exit 0
          fi
          echo "✅ force-app directory check passed"
        if: ${{ secrets.SFDX_AUTH_URL_SANDBOX != '' }}
      
      - name: Deploy validation (Check Only)
        run: |
          sf project deploy start --source-dir force-app --test-level RunLocalTests --dry-run --target-org validation-org
        if: ${{ secrets.SFDX_AUTH_URL_SANDBOX != '' }}
