# Deploy to Production environment
# Deploys to production when creating release tags or manually triggered

name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'  # Example: v1.0.0, v2.1.3
  workflow_dispatch:  # Allow manual trigger
    inputs:
      confirm:
        description: 'Confirm production deployment (enter "DEPLOY" to confirm)'
        required: true
        default: ''

jobs:
  # Validate confirmation input (manual trigger only)
  validate-input:
    name: Validate Deployment Confirmation
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Must enter 'DEPLOY' to confirm production deployment"
            exit 1
          fi
          echo "✅ Deployment confirmation passed"

  deploy-to-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate-input]
    if: always() && (needs.validate-input.result == 'success' || github.event_name == 'push')
    environment:
      name: Production
      url: https://login.salesforce.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version
      
      - name: Authorize to Production org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_PRODUCTION }}" > ./SFDX_AUTH_URL.txt
          sf org login sfdx-url --sfdx-url-file ./SFDX_AUTH_URL.txt --alias production-org --set-default
          rm ./SFDX_AUTH_URL.txt
      
      - name: Check force-app directory
        run: |
          if [ ! -d "force-app" ]; then
            echo "❌ Error: force-app directory does not exist"
            exit 1
          fi
          if [ -z "$(find force-app -type f -name '*.cls' -o -name '*.trigger' -o -name '*.component' 2>/dev/null)" ]; then
            echo "❌ Error: No Salesforce source files in force-app directory"
            exit 1
          fi
          echo "✅ force-app directory check passed"
      
      # Validate deployment first (Check Only)
      - name: Validate deployment
        run: |
          echo "🔍 Starting deployment validation..."
          sf project deploy start \
            --source-dir force-app \
            --test-level RunLocalTests \
            --dry-run \
            --target-org production-org \
            --wait 30
      
      # Actual deployment
      - name: Deploy to Production
        run: |
          echo "🚀 Starting deployment to production environment..."
          sf project deploy start \
            --source-dir force-app \
            --test-level RunLocalTests \
            --target-org production-org \
            --wait 30
      
      - name: Run all tests
        if: success()
        run: |
          echo "🧪 Running all Apex tests..."
          sf apex run test \
            --test-level RunLocalTests \
            --result-format human \
            --code-coverage \
            --target-org production-org \
            --wait 30
      
      - name: Create deployment report
        if: always()
        run: |
          echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
      
      - name: Deployment result notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Successfully deployed to Production environment"
          else
            echo "❌ Deployment to Production failed"
            exit 1
          fi
      
      - name: Get deployment details
        if: success()
        run: |
          sf org display --target-org production-org
