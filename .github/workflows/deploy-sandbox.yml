# Automatic deployment to Sandbox environment
# Deploys automatically when code is merged to develop branch

name: Deploy to Sandbox

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-to-sandbox:
    name: Deploy to Sandbox
    runs-on: ubuntu-latest
    environment:
      name: Sandbox
      url: https://test.salesforce.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version
      
      - name: Authorize to Sandbox org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_SANDBOX }}" > ./SFDX_AUTH_URL.txt
          sf org login sfdx-url --sfdx-url-file ./SFDX_AUTH_URL.txt --alias sandbox-org --set-default
          rm ./SFDX_AUTH_URL.txt
      
      - name: Check force-app directory
        run: |
          if [ ! -d "force-app" ]; then
            echo "⚠️  Warning: force-app directory does not exist"
            echo "Skipping deployment step"
            exit 0
          fi
          if [ -z "$(find force-app -type f -name '*.cls' -o -name '*.trigger' -o -name '*.component' 2>/dev/null)" ]; then
            echo "⚠️  Warning: No Salesforce source files in force-app directory"
            echo "Skipping deployment step"
            exit 0
          fi
          echo "✅ force-app directory check passed"
      
      - name: Deploy source code to Sandbox
        run: |
          sf project deploy start \
            --source-dir force-app \
            --test-level RunLocalTests \
            --target-org sandbox-org \
            --wait 30
      
      - name: Deployment result notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Successfully deployed to Sandbox environment"
          else
            echo "❌ Deployment to Sandbox failed"
            exit 1
          fi
      
      # Optional: Run Apex tests
      - name: Run Apex tests
        if: success()
        run: |
          sf apex run test \
            --test-level RunLocalTests \
            --result-format human \
            --code-coverage \
            --target-org sandbox-org \
            --wait 30
      
      - name: Get deployment details
        if: success()
        run: |
          sf org display --target-org sandbox-org
